site_name: Occlude
site_description: Opaque references to sensitive values, for Java.
site_url: https://jwcarman.github.io/occlude/
repo_url: https://github.com/jwcarman/occlude
repo_name: jwcarman/occlude
edit_uri: edit/main/docs/

docs_dir: docs

# Design records are working notes, not documentation. They stay out of the site.
exclude_docs: |
  /requirements.*
  /design/

theme:
  name: material
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

# Declaring plugins replaces MkDocs' default list, so search is named here too.
plugins:
  - search
  # https://llmstxt.org: an index of the docs for coding agents at /llms.txt, every page in
  # one file at /llms-full.txt, and a Markdown copy of each page beside its HTML.
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: |
        Occlude keeps sensitive values in custody and hands out opaque, labelled references; revealing a
        value is the one checked operation. Maven coordinates: `org.jwcarman.occlude`; for Spring Boot add
        `occlude-spring-boot-starter` and a PostgreSQL driver. The changelog says what each version has:
        https://github.com/jwcarman/occlude/blob/main/CHANGELOG.md.
      sections:
        Start here:
          - index.md: what Occlude is and the model in one page
          - guides/getting-started.md: "a worked example: a support desk that must not leak customer email"
          - guides/spring-boot.md: "the starter: declaring axes and wiring a charter in Spring Boot"
          - configuration.md: every occlude.* property the starter reads
        Concepts:
          - concepts/labels.md: axes and the labels values carry
          - concepts/ceilings.md: ceilings, what a reader is entitled to see
          - concepts/portals.md: the charter and the portals its declarations hand back
          - concepts/deriving.md: how a derived value's label joins its parents'
          - concepts/the-record.md: the record every operation writes, allowed or refused
          - concepts/erasing.md: erasing a subject's values by following lineage
        Guides:
          - guides/storage.md: "the PostgreSQL store: encryption, signing and setup"
          - guides/operating.md: checking, anchoring and rotating keys and roots in a store
          - guides/reviewing.md: reviewing a charter with manifest()
          - guides/testing.md: testing declarations, Spring wiring and a real store
          - limits.md: what Occlude does not do

nav:
  - Home: index.md
  - Concepts:
      - Axes and Labels: concepts/labels.md
      - Ceilings: concepts/ceilings.md
      - Portals: concepts/portals.md
      - Deriving: concepts/deriving.md
      - The Record: concepts/the-record.md
      - Erasing: concepts/erasing.md
  - Guides:
      - Getting Started: guides/getting-started.md
      - Spring Boot: guides/spring-boot.md
      - Storage: guides/storage.md
      - Operating a Store: guides/operating.md
      - Reviewing a Charter: guides/reviewing.md
      - Testing: guides/testing.md
  - Reference:
      - What Occlude Does Not Do: limits.md
      - Configuration: configuration.md
      - Security Policy: https://github.com/jwcarman/occlude/blob/main/SECURITY.md
      - Changelog: https://github.com/jwcarman/occlude/blob/main/CHANGELOG.md
