spring:
  application:
    name: billing-support
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/occlude}
    username: ${SPRING_DATASOURCE_USERNAME:occlude}
    password: ${SPRING_DATASOURCE_PASSWORD:occlude}

# A DEMO key, and the only one. Real deployments wrap data keys with a KMS-held key and rotate by
# adding a new one beside it -- EnvelopeCodec names the wrapping key by id for exactly that reason.
billing:
  key: ${BILLING_KEY:c2hoLXRoaXMtaXMtYS1kZW1vLWtleS0zMi1ieXRlcyE=}

management:
  endpoints:
    web:
      exposure:
        include: charter

logging:
  level:
    org.jwcarman.occlude.example.billing.OccludeConfiguration: INFO
