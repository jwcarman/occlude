spring:
  application:
    name: billing-support
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/occlude}
    username: ${SPRING_DATASOURCE_USERNAME:occlude}
    password: ${SPRING_DATASOURCE_PASSWORD:occlude}

# No keys and no root here. Real deployments supply both from the environment or a secret store,
# or contribute a DataKeyProvider bean backed by a KMS; without either, the application refuses to
# start and says what is missing. To run the example as checked out, activate the demo profile:
#
#   ./mvnw -pl occlude-example spring-boot:run -Dspring-boot.run.profiles=demo
#
management:
  endpoints:
    web:
      exposure:
        include: charter
  # Where the LGTM container in compose.yaml listens. Grafana is at http://localhost:3000.
  otlp:
    metrics:
      export:
        url: ${OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
        step: 10s
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_URL:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: 1.0
